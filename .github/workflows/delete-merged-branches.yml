name: Delete merged branches after 3 days

on:
  schedule:
    - cron: '0 2 * * *'   # daily at 2 AM UTC
  workflow_dispatch:        # allow manual trigger

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete branches merged 3+ days ago
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          CUTOFF=$(date -d '3 days ago' --utc +%Y-%m-%dT%H:%M:%SZ)
          echo "Deleting branches merged before $CUTOFF"

          gh pr list \
            --repo "$REPO" \
            --state merged \
            --limit 100 \
            --json headRefName,mergedAt \
            --jq '.[] | select(.mergedAt < "'"$CUTOFF"'") | .headRefName' \
          | grep -v '^main$' \
          | grep -v '^screenshots$' \
          | while read -r branch; do
              if gh api "repos/$REPO/git/refs/heads/$branch" &>/dev/null; then
                echo "Deleting: $branch (merged before cutoff)"
                gh api "repos/$REPO/git/refs/heads/$branch" -X DELETE
              else
                echo "Already gone: $branch"
              fi
            done
