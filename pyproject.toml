[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hubspaces"
dynamic = ["version"]
description = "Local markdown/HTML browser with split-pane preview, full-text search, and a task board — stdlib-only."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Atharva" }]
keywords = ["markdown", "documentation", "browser", "full-text-search", "static-site", "notes"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/auth-02/hub"
Repository = "https://github.com/auth-02/hub"

[project.scripts]
hub = "hubspace.cli.hub:main"
hub-server = "hubspace.cli.server:main"

# README screenshots / illustrations are docs-only (4.7 MB) — keep them out of
# the installed wheel. The 68 KB example/ fixture stays in for `hub --demo`.
[tool.hatch.version]
path = "hubspace/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["hubspace"]
exclude = [
    "hubspace/plugin",
]

# Runtime assets (favicon, hub.css, hub.js) live inside hubspace/assets and ship
# with the package automatically. Only example/ sits outside the package, so map
# it back under hubspace/ at build time; config.example_dir() resolves either
# spot. Docs-only assets/ (screenshots, illustrations) are never packaged.
[tool.hatch.build.targets.wheel.force-include]
"example" = "hubspace/example"

[tool.hatch.build.targets.sdist]
include = ["hubspace", "example", "README.md", "LICENSE"]
