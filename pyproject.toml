[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hubspaces"
dynamic = ["version"]
description = "A local, dependency-free ledger for agent-driven work: point it at a folder and every task, decision, run, and diagram becomes one searchable, traceable page. Stdlib-only Python."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Atharva" }]
keywords = ["claude-code", "agents", "ai", "local-first", "lineage", "task-tracking", "excalidraw", "diagrams", "markdown", "documentation", "full-text-search"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/auth-02/hub"
Repository = "https://github.com/auth-02/hub"

[project.scripts]
hub = "hubspace.cli.hub:main"

# README screenshots / illustrations are docs-only (4.7 MB) — keep them out of
# the installed wheel. The 68 KB example/ fixture stays in for `hub --demo`.
[tool.hatch.version]
path = "hubspace/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["hubspace"]
exclude = [
    "hubspace/plugin",
    "hubspace/ui",
]
# The built web assets under hubspace/static/ are .gitignore'd (source of truth is
# hubspace/ui/, rebuilt by `make build-ui`). Hatchling's VCS file selector would
# therefore drop them from the wheel — list them as artifacts so the shipped wheel
# always carries the built UI. CI runs `make build-ui` before `python -m build`.
artifacts = [
    "hubspace/static/hub.js",
    "hubspace/static/hub.css",
    "hubspace/static/draw.js",
    "hubspace/static/draw.css",
    "hubspace/static/chunk-*.js",
    "hubspace/static/favicon.svg",
    "hubspace/static/page.css",
    "hubspace/static/backlinks.css",
    "hubspace/static/chrome.css",
    "hubspace/static/excalidraw-assets/**",
]

# Runtime assets (favicon, hub.css, hub.js) live inside hubspace/assets and ship
# with the package automatically. Only example/ sits outside the package, so map
# it back under hubspace/ at build time; config.example_dir() resolves either
# spot. Docs-only assets/ (screenshots, illustrations) are never packaged.
[tool.hatch.build.targets.wheel.force-include]
"example" = "hubspace/example"

[tool.hatch.build.targets.sdist]
include = ["hubspace", "example", "README.md", "LICENSE"]
exclude = ["hubspace/ui/node_modules", "hubspace/ui/dist"]
# Carry the built (gitignored) UI assets so an sdist install works without Node too.
artifacts = [
    "hubspace/static/hub.js",
    "hubspace/static/hub.css",
    "hubspace/static/draw.js",
    "hubspace/static/draw.css",
    "hubspace/static/chunk-*.js",
    "hubspace/static/favicon.svg",
    "hubspace/static/page.css",
    "hubspace/static/backlinks.css",
    "hubspace/static/chrome.css",
    "hubspace/static/excalidraw-assets/**",
]
